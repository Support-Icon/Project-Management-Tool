name: Check Daily Manager Reports

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger due manager / team-lead reports
        run: |
          curl --fail-with-body --request POST \
            --header "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.VITE_API_URL }}/api/internal/daily-report"
