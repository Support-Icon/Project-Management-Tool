name: Check Daily Manager Reports

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger due manager / team-lead reports
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          API="${BACKEND_URL:-$VITE_API_URL}"
          API="${API%/}"
          if [ -z "$API" ]; then
            echo "Set GitHub secret BACKEND_URL or VITE_API_URL to the Lambda function URL."
            exit 1
          fi
          curl --fail-with-body --request POST \
            --header "X-Cron-Secret: ${CRON_SECRET}" \
            "${API}/api/internal/daily-report"
